<!doctype html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Телепат — Обменник</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{
    margin:0;
    background:#101722;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    max-width:520px;
    margin:auto;
    padding:25px 18px;
}

h1{
    text-align:center;
    color:#f4cf70;
    margin-bottom:25px;
}

.card{
    background:#202b3b;
    border:1px solid #6e5824;
    border-radius:22px;
    padding:20px;
}

.item{
    background:#111923;
    border-radius:15px;
    padding:15px;
    margin-top:12px;
}

.label{
    color:#9ca8b8;
    font-size:13px;
    margin-bottom:7px;
}

.value{
    color:#f4cf70;
    font-size:20px;
    font-weight:bold;
}

.balance{
    display:flex;
    gap:10px;
}

.balance .item{
    flex:1;
}

.status{
    margin-top:20px;
    text-align:center;
    line-height:1.5;
    font-size:14px;
    word-break:break-word;
}
</style></head><body><div class="app"><h1>👑 ТЕЛЕПАТ</h1><div class="card"><div class="item">
<div class="label">👤 ИМЯ</div>
<div id="name" class="value">Загрузка...</div>
</div><div class="item">
<div class="label">🆔 TELEGRAM ID</div>
<div id="telegramId" class="value">Загрузка...</div>
</div><div class="item">
<div class="label">👤 USERNAME</div>
<div id="username" class="value">Загрузка...</div>
</div><div class="balance"><div class="item">
<div class="label">🪙 TG</div>
<div id="tgBalance" class="value">0 TG</div>
</div><div class="item">
<div class="label">💵 TUSD</div>
<div id="tusdBalance" class="value">0 TUSD</div>
</div></div><div id="status" class="status">
⏳ Запуск приложения...
</div></div></div><script>

document.addEventListener("DOMContentLoaded", async function(){

    const status = document.getElementById("status");

    try {

        /* =========================
           TELEGRAM
        ========================= */

        status.textContent =
            "🔄 Получаем данные Telegram...";

        const tg = window.Telegram?.WebApp;

        if (!tg) {
            throw new Error(
                "Telegram WebApp API не найден."
            );
        }

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (!user) {
            throw new Error(
                "Telegram не передал данные пользователя. Открой Mini App именно через Telegram."
            );
        }

        let fullName = user.first_name || "";

        if (user.last_name) {
            fullName += " " + user.last_name;
        }

        document.getElementById("name").textContent =
            fullName || "Пользователь";

        document.getElementById("telegramId").textContent =
            user.id;

        document.getElementById("username").textContent =
            user.username
                ? "@" + user.username
                : "нет username";

        const telegramId = String(user.id);


        /* =========================
           SUPABASE
        ========================= */

        status.textContent =
            "🔄 Подключаемся к базе...";

        if (!window.supabase) {
            throw new Error(
                "Библиотека Supabase не загрузилась."
            );
        }

        const SUPABASE_URL =
            "https://jutszxuzjzyfxarceydw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_geRczpRc3faUHRGto2ue7A_eFFiJDwO";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           ПРОВЕРЯЕМ ТАБЛИЦУ USERS
        ========================= */

        status.textContent =
            "🔄 Проверяем пользователя в базе...";

        const result = await supabaseClient
            .from("users")
            .select("*")
            .eq("Telegram_id", telegramId)
            .maybeSingle();


        console.log(
            "Результат Supabase:",
            result
        );


        /* =========================
           ОШИБКА SUPABASE
        ========================= */

        if (result.error) {

            throw new Error(
                "Supabase: " +
                result.error.message +
                " | Код: " +
                result.error.code
            );

        }


        /* =========================
           ПОЛЬЗОВАТЕЛЯ НЕТ
        ========================= */

        if (!result.data) {

            status.innerHTML =
                "⚠️ Подключение к базе работает.<br><br>" +
                "Но Telegram ID <b>" +
                telegramId +
                "</b> не найден в таблице users.";

            return;
        }


        /* =========================
           ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
        ========================= */

        const data = result.data;

        console.log(
            "Пользователь:",
            data
        );


        /* =========================
           БАЛАНС TG
        ========================= */

        const tgBalance =
            Number(data.tg_balance || 0);


        /* =========================
           БАЛАНС TUSD
        ========================= */

        const tusdBalance =
            Number(data.tusd_balance || 0);


        document.getElementById(
            "tgBalance"
        ).textContent =
            tgBalance.toLocaleString(
                "ru-RU",
                {
                    maximumFractionDigits:8
                }
            ) + " TG";


        document.getElementById(
            "tusdBalance"
        ).textContent =
            tusdBalance.toLocaleString(
                "ru-RU",
                {
                    maximumFractionDigits:8
                }
            ) + " TUSD";


        /* =========================
           ГОТОВО
        ========================= */

        status.textContent =
            "✅ База подключена. Баланс загружен.";

    }

    catch(error) {

        console.error(
            "Ошибка приложения:",
            error
        );

        status.innerHTML =
            "❌ ОШИБКА<br><br>" +
            error.message;

    }

});

</script></body>
</html>
