<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Телепат — Обменник</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 0 80px 0;
    background: #f4f5f7;
    color: #222;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2, h3 {
    margin-top: 0;
}

.title {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
}

.balance {
    font-size: 20px;
    font-weight: bold;
    margin: 8px 0;
}

.small {
    color: #777;
    font-size: 13px;
}

input,
select {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-main {
    background: #222;
    color: white;
}

.btn-buy {
    background: #159447;
    color: white;
}

.btn-cancel {
    background: #e74c3c;
    color: white;
}

.btn-secondary {
    background: #eeeeee;
    color: #222;
}

.btn-gold {
    background: #d6a400;
    color: white;
}

.btn-blue {
    background: #2481cc;
    color: white;
}

.exchange-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.exchange-row > div {
    flex: 1;
}

.swap {
    width: 45px;
    min-width: 45px;
    padding: 10px 0;
    background: #eeeeee;
}

.receive-box {
    background: #f1f7ff;
    border-radius: 12px;
    padding: 14px;
    margin-top: 5px;
    margin-bottom: 10px;
}

.receive-value {
    font-size: 22px;
    font-weight: bold;
}

.order {
    border: 1px solid #e1e1e1;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
    background: #fafafa;
}

.order-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.order-amount {
    font-size: 19px;
    font-weight: bold;
}

.order-rate {
    color: #666;
    font-size: 14px;
}

.status {
    padding: 8px 12px;
    background: #fff3cd;
    border-radius: 10px;
    margin-top: 10px;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

.nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 70px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
}

.nav button {
    background: none;
    margin: 0;
    padding: 5px;
    font-size: 13px;
    color: #555;
}

.nav button.active {
    color: #000;
    font-weight: bold;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #777;
}

.error {
    color: #c0392b;
    font-size: 14px;
    margin-top: 8px;
}

.success {
    color: #159447;
    font-size: 14px;
    margin-top: 8px;
}

.referral-link {
    background: #f4f5f7;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    word-break: break-all;
    margin-top: 10px;
}

.reward-box {
    background: #fff8df;
    border-radius: 14px;
    padding: 15px;
    margin-top: 12px;
}

.reward-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
}

.stat {
    flex: 1;
    background: #f5f5f5;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.stat-number {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

hr {
    border: 0;
    border-top: 1px solid #eee;
    margin: 15px 0;
}
</style>
</head>

<body>

<div class="container">

    <!-- КОШЕЛЁК -->

    <div id="walletSection">

        <div class="title">
            👑 ТЕЛЕПАТ
        </div>

        <div class="card">

            <h3>👤 Имя</h3>
            <div id="userName">Загрузка...</div>

            <hr>

            <div class="small">🆔 TELEGRAM ID</div>
            <div id="telegramId">Загрузка...</div>

            <hr>

            <div class="small">👤 USERNAME</div>
            <div id="username">Загрузка...</div>

            <hr>

            <div class="balance">
                🪙 TG:
                <span id="tgBalance">0</span> TG
            </div>

            <div class="balance">
                🤖 AI:
                <span id="aiBalance">0</span> AI
            </div>

            <div class="balance">
                💵 TUSD:
                <span id="tusdBalance">0</span> TUSD
            </div>

            <div id="connectionStatus" class="status">
                Подключение к базе...
            </div>

        </div>


        <div class="card">

            <h3>🎁 Бонус новичка</h3>

            <div class="small">
                При первом входе новый пользователь получает:
            </div>

            <div class="reward-box">
                <div>🪙 +0.000001 TG</div>
                <div>💵 +0.01 TUSD</div>
            </div>

            <div id="welcomeBonusMessage"></div>

        </div>

    </div>


    <!-- ОБМЕН -->

    <div id="exchangeSection" class="hidden">

        <div class="title">
            🔄 Обмен
        </div>

        <div class="card">

            <h3>Обмен токенов</h3>

            <div class="exchange-row">

                <div>

                    <div class="small">
                        Вы отдаёте
                    </div>

                    <select
                        id="fromToken"
                        onchange="updateExchange()"
                    >
                        <option value="TG">TG</option>
                        <option value="TUSD">TUSD</option>
                    </select>

                </div>

                <button
                    class="swap"
                    onclick="swapTokens()"
                >
                    ↕️
                </button>

                <div>

                    <div class="small">
                        Получаете
                    </div>

                    <select
                        id="toToken"
                        onchange="updateExchange()"
                    >
                        <option value="TUSD">TUSD</option>
                        <option value="TG">TG</option>
                    </select>

                </div>

            </div>

            <div
                class="small"
                id="availableText"
            >
                Доступно: 0
            </div>

            <input
                id="exchangeAmount"
                type="number"
                step="any"
                min="0"
                placeholder="Введите сумму
