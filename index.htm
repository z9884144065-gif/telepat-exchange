<!doctype html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Телепат — Обменник</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101722;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px 100px;
}

h1{
  font-size:27px;
  text-align:center;
  margin:8px 0 4px;
  color:#f4cf70;
}

.sub{
  text-align:center;
  color:#9ca8b8;
  margin-bottom:25px;
}

.card{
  background:linear-gradient(145deg,#202b3b,#151d29);
  border:1px solid #6e5824;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 10px 30px #0005;
}

.title{
  color:#f4cf70;
  font-size:14px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.balance{
  font-size:34px;
  font-weight:bold;
  margin:8px 0 20px;
}

.row{
  display:flex;
  gap:10px;
}

.coin{
  flex:1;
  background:#111923;
  border-radius:15px;
  padding:14px;
}

.coin b{
  display:block;
  font-size:22px;
  color:#f4cf70;
}

.coin span{
  color:#aeb8c6;
  font-size:13px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  background:#d8b44f;
  color:#151515;
}

button.secondary{
  background:#263344;
  color:#fff;
  border:1px solid #536174;
}

button.admin{
  background:linear-gradient(135deg,#f4cf70,#b88620);
  color:#171717;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #354052;
}

.stat:last-child{
  border-bottom:0;
}

.stat span{
  color:#aeb8c6;
}

.stat b{
  color:#f4cf70;
}

.admin-box{
  display:none;
}

.admin-user{
  background:#111923;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
}

.admin-user strong{
  color:#f4cf70;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#121a25;
  border-top:1px solid #334052;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.nav button{
  width:auto;
  margin:0;
  padding:11px 13px;
  font-size:13px;
  background:#1e2938;
  color:#fff;
}
</style></head><body><div class="app"><h1>👑 ТЕЛЕПАТ</h1>
<div class="sub">Виртуальный обменник</div><!-- БАЛАНС --><div class="card"><div class="title">МОЙ БАЛАНС</div><div class="row"><div class="coin">
<b id="tgBalance">0 TG</b>
<span>Телепат Голд</span>
</div><div class="coin">
<b id="tusdBalance">0 TUSD</b>
<span>Телепат Доллар</span>
</div></div><button onclick="deposit()">
💰 Пополнить
</button><button class="secondary" onclick="exchange()">
🔄 Обменять
</button></div><!-- ПРОФИЛЬ --><div class="card"><div class="title">ПРОФИЛЬ</div><div id="user">
Пользователь Telegram
</div><button class="secondary" onclick="history()">
📜 История операций
</button></div><!-- АДМИН-ПАНЕЛЬ --><div class="card admin-box" id="adminPanel"><div class="title">
👑 АДМИН-ПАНЕЛЬ
</div><div class="stat">
<span>👥 Пользователи</span>
<b id="usersCount">1</b>
</div><div class="stat">
<span>💰 TG в системе</span>
<b id="totalTG">0</b>
</div><div class="stat">
<span>💵 TUSD в системе</span>
<b id="totalTUSD">0</b>
</div><button class="admin" onclick="addBalance()">
➕ Начислить баланс
</button><button class="secondary" onclick="removeBalance()">
➖ Списать баланс
</button><button class="secondary" onclick="showUsers()">
👥 Пользователи
</button><div id="adminMessage"></div></div></div><!-- НИЖНЕЕ МЕНЮ --><div class="nav"><button onclick="scrollTo(0,0)">
🏠 Главная
</button><button onclick="scrollToBalance()">
💰 Баланс
</button><button onclick="exchange()">
🔄 Обмен
</button><button onclick="scrollToProfile()">
👤 Профиль
</button></div><script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* =========================
   ТВОЙ TELEGRAM ID
========================= */

const ADMIN_ID = "949707357";


/* =========================
   ПОЛЬЗОВАТЕЛЬ
========================= */

const user = tg?.initDataUnsafe?.user;

let currentUserId = "";

if(user){

  currentUserId = String(user.id);

  let name =
    (user.first_name || "") +
    " " +
    (user.last_name || "");

  if(user.username){
    name += " @" + user.username;
  }

  document.getElementById("user").textContent = name;
}


/* =========================
   ПРОВЕРКА АДМИНА
========================= */

if(currentUserId === ADMIN_ID){

  document.getElementById("adminPanel").style.display = "block";

}


/* =========================
   КНОПКА ПОПОЛНИТЬ
========================= */

function deposit(){

  alert(
    "💰 Пополнение\n\n" +
    "Здесь следующим этапом сделаем создание заявки на пополнение."
  );

}


/* =========================
   ОБМЕН
========================= */

function exchange(){

  alert(
    "🔄 Обмен\n\n" +
    "Здесь следующим этапом сделаем обмен TG ↔ TUSD."
  );

}


/* =========================
   ИСТОРИЯ
========================= */

function history(){

  alert(
    "📜 История операций\n\n" +
    "История будет подключена после создания базы данных."
  );

}


/* =========================
   АДМИН: НАЧИСЛЕНИЕ
========================= */

function addBalance(){

  const amount = prompt(
    "Введите количество TG для начисления:"
  );

  if(!amount) return;

  if(isNaN(amount)){

    alert("Введите число.");

    return;

  }

  document.getElementById("tgBalance").textContent =
    amount + " TG";

  document.getElementById("totalTG").textContent =
    amount;

  document.getElementById("adminMessage").innerHTML =
    "<div class='admin-user'>" +
    "✅ Баланс изменён на <strong>" +
    amount +
    " TG</strong><br><br>" +
    "⚠️ Пока это тестовый режим. " +
    "После подключения базы данных баланс будет сохраняться." +
    "</div>";

}


/* =========================
   АДМИН: СПИСАНИЕ
========================= */

function removeBalance(){

  const amount = prompt(
    "Введите количество TG для списания:"
  );

  if(!amount) return;

  if(isNaN(amount)){

    alert("Введите число.");

    return;

  }

  document.getElementById("tgBalance").textContent =
    "0 TG";

  document.getElementById("totalTG").textContent =
    "0";

  document.getElementById("adminMessage").innerHTML =
    "<div class='admin-user'>" +
    "➖ Тестовое списание: <strong>" +
    amount +
    " TG</strong><br><br>" +
    "⚠️ Пока это тестовый режим." +
    "</div>";

}


/* =========================
   СПИСОК ПОЛЬЗОВАТЕЛЕЙ
========================= */

function showUsers(){

  const name =
    user ?
    ((user.first_name || "") +
    " " +
    (user.last_name || "")) :
    "Пользователь";

  document.getElementById("adminMessage").innerHTML =
    "<div class='admin-user'>" +

    "<strong>👤 " +
    name +
    "</strong><br><br>" +

    "Telegram ID: " +
    currentUserId +
    "<br>" +

    "Баланс TG: " +
    document.getElementById("tgBalance").textContent +

    "<br><br>" +

    "📌 Полноценный список пользователей " +
    "подключим после создания базы данных." +

    "</div>";

}


/* =========================
   НАВИГАЦИЯ
========================= */

function scrollToBalance(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function scrollToProfile(){

  document
    .getElementById("user")
    .scrollIntoView({
      behavior:"smooth"
    });

}

</script></body>
</html>
