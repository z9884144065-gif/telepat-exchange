<!doctype html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Телепат — Тест</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
    margin:0;
    background:#101722;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    max-width:500px;
    margin:auto;
    padding:30px 20px;
}

h1{
    text-align:center;
    color:#f4cf70;
}

.card{
    background:#202b3b;
    border:1px solid #6e5824;
    border-radius:20px;
    padding:25px;
    margin-top:20px;
}

.item{
    background:#111923;
    border-radius:15px;
    padding:18px;
    margin-top:12px;
}

.label{
    color:#9ca8b8;
    font-size:13px;
    margin-bottom:7px;
}

.value{
    font-size:20px;
    font-weight:bold;
    color:#f4cf70;
    word-break:break-word;
}

.balance{
    display:flex;
    gap:10px;
}

.balance .item{
    flex:1;
}

.status{
    text-align:center;
    margin-top:20px;
    color:#9ca8b8;
}

</style>

</head>

<body>

<div class="app">

<h1>👑 ТЕЛЕПАТ</h1>

<div class="card">

<div class="item">

<div class="label">
👤 ИМЯ
</div>

<div class="value" id="name">
Проверяем...
</div>

</div>


<div class="item">

<div class="label">
🆔 TELEGRAM ID
</div>

<div class="value" id="telegramId">
Проверяем...
</div>

</div>


<div class="item">

<div class="label">
👤 USERNAME
</div>

<div class="value" id="username">
Проверяем...
</div>

</div>


<div class="balance">

<div class="item">

<div class="label">
🪙 TG
</div>

<div class="value">
0 TG
</div>

</div>


<div class="item">

<div class="label">
💵 TUSD
</div>

<div class="value">
0 TUSD
</div>

</div>

</div>


<div class="status"
     id="status">

Проверяем Telegram...

</div>

</div>

</div>


<script>

const tg =
window.Telegram?.WebApp;


/* Запускаем Telegram WebApp */

if(tg){

    tg.ready();

    tg.expand();

}


/* Получаем пользователя */

const user =
tg?.initDataUnsafe?.user;


/* Показываем данные */

if(user){

    document.getElementById(
        "name"
    ).textContent =
        (
            user.first_name || ""
        ) +
        (
            user.last_name
            ? " " + user.last_name
            : ""
        );


    document.getElementById(
        "telegramId"
    ).textContent =
        user.id;


    document.getElementById(
        "username"
    ).textContent =
        user.username
        ? "@" + user.username
        : "нет username";


    document.getElementById(
        "status"
    ).textContent =
        "✅ Telegram ID успешно получен";

}else{

    document.getElementById(
        "name"
    ).textContent =
        "Не найден";


    document.getElementById(
        "telegramId"
    ).textContent =
        "ID НЕ ПОЛУЧЕН";


    document.getElementById(
        "username"
    ).textContent =
        "Не найден";


    document.getElementById(
        "status"
    ).textContent =
        "❌ Telegram не передал данные пользователя";

}

</script>

</body>

</html>
