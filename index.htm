<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Телепат — Обменник</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101722;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px 100px;
}

h1{
  font-size:27px;
  text-align:center;
  margin:8px 0 4px;
  color:#f4cf70;
}

.sub{
  text-align:center;
  color:#9ca8b8;
  margin-bottom:25px;
}

.card{
  background:linear-gradient(145deg,#202b3b,#151d29);
  border:1px solid #6e5824;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 10px 30px #0005;
}

.title{
  color:#f4cf70;
  font-size:14px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.profile-name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.profile-id{
  color:#9ca8b8;
  font-size:13px;
}

.status{
  text-align:center;
  color:#f4cf70;
  font-size:13px;
  min-height:20px;
  margin-bottom:10px;
}

.row{
  display:flex;
  gap:10px;
}

.coin{
  flex:1;
  background:#111923;
  border-radius:15px;
  padding:14px;
}

.coin b{
  display:block;
  font-size:22px;
  color:#f4cf70;
}

.coin span{
  color:#aeb8c6;
  font-size:13px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  background:#d8b44f;
  color:#151515;
}

button.secondary{
  background:#263344;
  color:#fff;
  border:1px solid #536174;
}

button.admin{
  background:linear-gradient(135deg,#f4cf70,#b88620);
  color:#171717;
}

button:active{
  transform:scale(.98);
}

.referral-input{
  width:100%;
  padding:13px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid #536174;
  background:#111923;
  color:#fff;
  font-size:13px;
}

.referral-info{
  color:#aeb8c6;
  font-size:14px;
  line-height:1.6;
}

.referral-info strong{
  color:#f4cf70;
}

#referralStatus{
  text-align:center;
  color:#f4cf70;
  min-height:20px;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #354052;
}

.stat:last-child{
  border-bottom:0;
}

.stat span{
  color:#aeb8c6;
}

.stat b{
  color:#f4cf70;
}

.admin-box{
  display:none;
}

.admin-user{
  background:#111923;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
  line-height:1.7;
}

.admin-user strong{
  color:#f4cf70;
}

.wallet-box{
  background:#111923;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
}

.wallet-address{
  word-break:break-all;
  color:#aeb8c6;
  font-size:12px;
  line-height:1.5;
  margin-top:10px;
}

.wallet-status{
  text-align:center;
  color:#f4cf70;
  min-height:20px;
  margin-top:10px;
  font-size:13px;
}

#ton-connect{
  margin-top:10px;
}

#ton-connect button{
  margin-top:0 !important;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#121a25;
  border-top:1px solid #334052;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:100;
}

.nav button{
  width:auto;
  margin:0;
  padding:11px 13px;
  font-size:13px;
  background:#1e2938;
  color:#fff;
}

.loading{
  opacity:.6;
}

.error{
  color:#ff8b8b;
}

.success{
  color:#8be0a8;
}

</style>

</head>

<body>

<div class="app">

<h1>👑 ТЕЛЕПАТ</h1>

<div class="sub">
Виртуальный обменник
