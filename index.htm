<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Телепат — Обменник</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101722;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px 100px;
}

h1{
  font-size:27px;
  text-align:center;
  margin:8px 0 4px;
  color:#f4cf70;
}

.sub{
  text-align:center;
  color:#9ca8b8;
  margin-bottom:25px;
}

.card{
  background:linear-gradient(145deg,#202b3b,#151d29);
  border:1px solid #6e5824;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 10px 30px #0005;
}

.title{
  color:#f4cf70;
  font-size:14px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.balance{
  font-size:34px;
  font-weight:bold;
  margin:8px 0 20px;
}

.row{
  display:flex;
  gap:10px;
}

.coin{
  flex:1;
  background:#111923;
  border-radius:15px;
  padding:14px;
}

.coin b{
  display:block;
  font-size:22px;
  color:#f4cf70;
}

.coin span{
  color:#aeb8c6;
  font-size:13px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  background:#d8b44f;
  color:#151515;
}

button.secondary{
  background:#263344;
  color:#fff;
  border:1px solid #536174;
}

button.admin{
  background:linear-gradient(135deg,#f4cf70,#b88620);
  color:#171717;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #354052;
}

.stat:last-child{
  border-bottom:0;
}

.stat span{
  color:#aeb8c6;
}

.stat b{
  color:#f4cf70;
}

.admin-box{
  display:none;
}

.admin-user{
  background:#111923;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
}

.admin-user strong{
  color:#f4cf70;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#121a25;
  border-top:1px solid #334052;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.nav button{
  width:auto;
  margin:0;
  padding:11px 13px;
  font-size:13px;
  background:#1e2938;
  color:#fff;
}
</style>
</head>

<body>

<div class="app">

<h1>👑 ТЕЛЕПАТ</h1>

<div class="sub">Виртуальный обменник</div>

<!-- БАЛАНС -->

<div class="card">

<div class="title">МОЙ БАЛАНС</div>

<div class="row">

<div class="coin">
<b id="tgBalance">0 TG</b>
<span>Телепат Голд</span>
</div>

<div class="coin">
<b id="tusdBalance">0 TUSD</b>
<span>Телепат Доллар</span>
</div>

</div>

<button onclick="deposit()">
💰 Пополнить
</button>

<button class="secondary" onclick="exchange()">
🔄 Обменять
</button>

</div>

<!-- ПРОФИЛЬ -->

<div class="card">

<div class="title">ПРОФИЛЬ</div>

<div id="user">
Загрузка пользователя...
</div>

<button class="secondary" onclick="history()">
📜 История операций
</button>

</div>

<!-- АДМИН -->

<div class="card admin-box" id="adminPanel">

<div class="title">
👑 АДМИН-ПАНЕЛЬ
</div>

<div class="stat">
<span>👥 Пользователи</span>
<b id="usersCount">0</b>
</div>

<div class="stat">
<span>💰 TG в системе</span>
<b id="totalTG">0</b>
</div>

<div class="stat">
<span>💵 TUSD в системе</span>
<b id="totalTUSD">0</b>
</div>

<button class="admin" onclick="addBalance()">
➕ Начислить баланс
</button>

<button class="secondary" onclick="removeBalance()">
➖ Списать баланс
</button>

<button class="secondary" onclick="showUsers()">
👥 Пользователи
</button>

<div id="adminMessage"></div>

</div>

</div>

<!-- НИЖНЕЕ МЕНЮ -->

<div class="nav">

<button onclick="scrollTo(0,0)">
🏠 Главная
</button>

<button onclick="scrollToBalance()">
💰 Баланс
</button>

<button onclick="exchange()">
🔄 Обмен
</button>

<button onclick="scrollToProfile()">
👤 Профиль
</button>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://jutszxuzjzyfxarceydw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_geRczpRc3faUHRGto2ueA_eFFiJDwO";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   АДМИН
========================= */

const ADMIN_ID = "949707357";


/* =========================
   ПОЛЬЗОВАТЕЛЬ
========================= */

const user =
tg?.initDataUnsafe?.user;

let currentUserId = "";


/* =========================
   ЗАПУСК
========================= */

async function startApp(){

  if(!user){

    document.getElementById("user").textContent =
      "Откройте приложение через Telegram";

    return;

  }

  currentUserId = String(user.id);

  let name =
    (user.first_name || "") +
    " " +
    (user.last_name || "");

  if(user.username){
    name += " @" + user.username;
  }

  document.getElementById("user").textContent =
    name.trim();


  /* АДМИН */

  if(currentUserId === ADMIN_ID){

    document.getElementById("adminPanel").style.display =
      "block";

  }


  /* ПОЛУЧАЕМ ПОЛЬЗОВАТЕЛЯ */

  await loadUser();

}


/* =========================
   ЗАГРУЗКА ПОЛЬЗОВАТЕЛЯ
========================= */

async function loadUser(){

  const { data, error } =
    await supabaseClient
      .from("users")
      .select("*")
      .eq("Ttelegram_id", currentUserId)
      .maybeSingle();


  if(error){

    console.error(error);

    alert(
      "Ошибка подключения к базе данных:\n" +
      error.message
    );

    return;

  }


  /* ЕСЛИ ПОЛЬЗОВАТЕЛЯ НЕТ */

  if(!data){

    const { data:newUser, error:createError } =
      await supabaseClient
        .from("users")
        .insert({

          Ttelegram_id: currentUserId,

          first_name:
            user.first_name || "",

          username:
            user.username || "",

          tg_balance: 0,

          tusd_balance: 0

        })
        .select()
        .single();


    if(createError){

      console.error(createError);

      alert(
        "Не удалось создать пользователя:\n" +
        createError.message
      );

      return;

    }

    updateBalance(
      newUser.tg_balance,
      newUser.tusd_balance
    );

    return;

  }


  /* ЕСЛИ ПОЛЬЗОВАТЕЛЬ ЕСТЬ */

  updateBalance(
    data.tg_balance,
    data.tusd_balance
  );

}


/* =========================
   ПОКАЗАТЬ БАЛАНС
========================= */

function updateBalance(tgBalance,tusdBalance){

  document.getElementById("tgBalance").textContent =
    Number(tgBalance || 0) + " TG";

  document.getElementById("tusdBalance").textContent =
    Number(tusdBalance || 0) + " TUSD";

}


/* =========================
   ПОПОЛНЕНИЕ
========================= */

function deposit(){

  alert(
    "💰 Пополнение\n\n" +
    "Следующим этапом здесь создадим заявку на пополнение."
  );

}


/* =========================
   ОБМЕН
========================= */

function exchange(){

  alert(
    "🔄 Обмен\n\n" +
    "Следующим этапом подключим обмен TG ↔ TUSD."
  );

}


/* =========================
   ИСТОРИЯ
========================= */

function history(){

  alert(
    "📜 История операций\n\n" +
    "Следующим этапом подключим журнал операций."
  );

}


/* =========================
   АДМИН: НАЧИСЛЕНИЕ
========================= */

async function addBalance(){

  const amount =
    prompt("Введите количество TG для начисления:");

  if(!amount) return;

  const number =
    Number(amount);

  if(isNaN(number) || number <= 0){

    alert("Введите положительное число.");

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("users")
      .select("tg_balance")
      .eq("Ttelegram_id", currentUserId)
      .single();


  if(error){

    alert("Ошибка загрузки баланса: " + error.message);

    return;

  }


  const newBalance =
    Number(data.tg_balance || 0) + number;


  const { error:updateError } =
    await supabaseClient
      .from("users")
      .update({
        tg_balance:newBalance
      })
      .eq("Ttelegram_id",currentUserId);


  if(updateError){

    alert(
      "Ошибка изменения баланса:\n" +
      updateError.message
    );

    return;

  }


  updateBalance(
    newBalance,
    document
      .getElementById("tusdBalance")
      .textContent
      .replace(" TUSD","")
  );


  document.getElementById("adminMessage").innerHTML =
    "<div class='admin-user'>" +
    "✅ Начислено <strong>" +
    number +
    " TG</strong><br><br>" +
    "Новый баланс: <strong>" +
    newBalance +
    " TG</strong>" +
    "</div>";


  await loadAdminStats();

}


/* =========================
   АДМИН: СПИСАНИЕ
========================= */

async function removeBalance(){

  const amount =
    prompt("Введите количество TG для списания:");

  if(!amount) return;

  const number =
    Number(amount);

  if(isNaN(number) || number <= 0){

    alert("Введите положительное число.");

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("users")
      .select("tg_balance")
      .eq("Ttelegram_id",currentUserId)
      .single();


  if(error){

    alert("Ошибка загрузки баланса: " + error.message);

    return;

  }


  const currentBalance =
    Number(data.tg_balance || 0);


  if(number > currentBalance){

    alert("Недостаточно TG для списания.");

    return;

  }


  const newBalance =
    currentBalance - number;


  const { error:updateError } =
    await supabaseClient
      .from("users")
      .update({
        tg_balance:newBalance
      })
      .eq("Ttelegram_id",currentUserId);


  if(updateError){

    alert(
      "Ошибка изменения баланса:\n" +
      updateError.message
    );

    return;

  }


  updateBalance(
    newBalance,
    document
      .getElementById("tusdBalance")
      .textContent
      .replace(" TUSD","")
  );


  document.getElementById("adminMessage").innerHTML =
    "<div class='admin-user'>" +
    "➖ Списано <strong>" +
    number +
    " TG</strong><br><br>" +
    "Новый баланс: <strong>" +
    newBalance +
    " TG</strong>" +
    "</div>";


  await loadAdminStats();

}


/* =========================
   СТАТИСТИКА АДМИНА
========================= */

async function loadAdminStats(){

  if(currentUserId !== ADMIN_ID) return;


  const { data, error } =
    await supabaseClient
      .from("users")
      .select("tg_balance,tusd_balance");


  if(error){

    console.error(error);

    return;

  }


  let totalTG = 0;
  let totalTUSD = 0;


  data.forEach(item => {

    totalTG +=
      Number(item.tg_balance || 0);

    totalTUSD +=
      Number(item.tusd_balance || 0);

  });


  document.getElementById("usersCount").textContent =
    data.length;

  document.getElementById("totalTG").textContent =
    totalTG;

  document.getElementById("totalTUSD").textContent =
    totalTUSD;

}


/* =========================
   ПОЛЬЗОВАТЕЛИ
========================= */

async function showUsers(){

  const { data, error } =
    await supabaseClient
      .from("users")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    alert(
      "Ошибка загрузки пользователей:\n" +
      error.message
    );

    return;

  }


  let html =
    "<div class='admin-user'>" +
    "<strong>👥 Пользователи</strong><br><br>";


  if(!data.length){

    html += "Пользователей пока нет.";

  }


  data.forEach(item => {

    html +=
      "👤 " +
      (item.first_name || "Без имени") +
      (item.username ?
        " @" + item.username :
        "") +
      "<br>" +

      "ID: " +
      item.Ttelegram_id +
      "<br>" +

      "TG: <strong>" +
      Number(item.tg_balance || 0) +
      "</strong>" +

      "<br>" +

      "TUSD: <strong>" +
      Number(item.tusd_balance || 0) +
      "</strong>" +

      "<hr>";

  });


  html += "</div>";


  document.getElementById("adminMessage").innerHTML =
    html;

}


/* =========================
   НАВИГАЦИЯ
========================= */

function scrollToBalance(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function scrollToProfile(){

  document
    .getElementById("user")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   СТАРТ
========================= */

startApp();

</script>

</body>
</html>
