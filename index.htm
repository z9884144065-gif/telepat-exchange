<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Телепат — Обменник</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#101722;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
}

.app{
max-width:520px;
margin:auto;
padding:25px 18px 40px;
}

h1{
text-align:center;
font-size:30px;
color:#f4cf70;
margin:10px 0 25px;
}

.card{
background:#202b3b;
border:1px solid #6e5824;
border-radius:22px;
padding:22px;
margin-bottom:18px;
}

.item{
background:#111923;
border-radius:16px;
padding:17px;
margin-top:12px;
}

.label{
color:#9ca8b8;
font-size:14px;
margin-bottom:8px;
}

.value{
color:#f4cf70;
font-size:21px;
font-weight:bold;
word-break:break-word;
}

.balance{
display:flex;
gap:10px;
}

.balance .item{
flex:1;
}

.status{
text-align:center;
font-size:14px;
color:#aeb8c6;
margin-top:18px;
line-height:1.5;
}

.ok{
color:#8be0a8;
}

.error{
color:#ff8b8b;
}

</style>

</head>

<body>

<div class="app">

<h1>👑 ТЕЛЕПАТ</h1>

<div class="card">

<div class="item">

<div class="label">
👤 ИМЯ
</div>

<div
id="name"
class="value">

Загрузка...

</div>

</div>


<div class="item">

<div class="label">
🆔 TELEGRAM ID
</div>

<div
id="telegramId"
class="value">

Загрузка...

</div>

</div>


<div class="item">

<div class="label">
👤 USERNAME
</div>

<div
id="username"
class="value">

Загрузка...

</div>

</div>


<div class="balance">

<div class="item">

<div class="label">
🪙 TG
</div>

<div
id="tgBalance"
class="value">

0 TG

</div>

</div>


<div class="item">

<div class="label">
💵 TUSD
</div>

<div
id="tusdBalance"
class="value">

0 TUSD

</div>

</div>

</div>


<div
id="status"
class="status">

Подключение к базе...

</div>

</div>

</div>


<script>

/* =========================================
   TELEGRAM
========================================= */

const tg =
window.Telegram?.WebApp;

if(tg){

tg.ready();

tg.expand();

}


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jutszxuzjzyfxarceydw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_geRczpRc3faUHRGto2ue7A_eFFiJDwO";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   ЗАПУСК
========================================= */

async function startApp(){

try{

/* Получаем пользователя Telegram */

const user =
tg?.initDataUnsafe?.user;


/* Если Telegram пользователя нет */

if(!user){

document.getElementById(
"status"
).textContent =
"❌ Telegram пользователь не найден";

document.getElementById(
"status"
).className =
"status error";

return;

}


/* =========================================
   ДАННЫЕ TELEGRAM
========================================= */

let name =
user.first_name || "";

if(user.last_name){

name +=
" " + user.last_name;

}

document.getElementById(
"name"
).textContent =
name || "Пользователь";


document.getElementById(
"telegramId"
).textContent =
user.id;


document.getElementById(
"username"
).textContent =

user.username
?
"@" + user.username
:
"нет username";


/* =========================================
   TELEGRAM ID
========================================= */

const telegramId =
String(user.id);


/* =========================================
   ЗАПРОС В SUPABASE
========================================= */

const result =
await supabaseClient

.from("users")

.select(
"Telegram_id,tg_balance,tusd_balance"
)

.eq(
"Telegram_id",
telegramId
)

.maybeSingle();


/* =========================================
   ОШИБКА SUPABASE
========================================= */

if(result.error){

console.error(
"Supabase error:",
result.error
);

document.getElementById(
"status"
).textContent =
"❌ Ошибка Supabase: " +
result.error.message;

document.getElementById(
"status"
).className =
"status error";

return;

}
