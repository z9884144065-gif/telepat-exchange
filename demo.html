<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telepat — Демо главного экрана</title>
<style>
:root{
  --bg:#0b1018; --card:#141c28; --card2:#1a2432; --line:#344154;
  --gold:#f4cf70; --gold2:#d9ad3e; --text:#fff; --muted:#9da9b9;
  --green:#39d98a; --red:#ff647c; --blue:#55a7ff;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{
  background:radial-gradient(circle at 50% -10%,#26334a 0,#0b1018 42%),var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:560px;margin:auto;padding:12px 12px 92px}
h1{text-align:center;color:var(--gold);margin:6px 0 2px;font-size:26px;letter-spacing:1px}
.subtitle{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}

/* Верхняя панель иконок */
.topbar{
  display:flex;gap:6px;justify-content:space-between;
  margin-bottom:14px;
}
.topbar button{
  flex:1;padding:10px 6px;border:1px solid #45536a;border-radius:12px;
  background:linear-gradient(145deg,#1b2636,#111925);color:#fff;
  font-size:16px;margin:0;cursor:pointer;
}

/* Статистика в 3 блока */
.stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  margin-bottom:14px;
}
.stat{
  background:linear-gradient(145deg,#1b2636,#111925);
  border:1px solid #39475b;border-radius:14px;
  padding:12px 8px;text-align:center;
}
.stat b{display:block;font-size:16px;color:#fff}
.stat span{color:#8f9bab;font-size:10px;display:block;margin-top:3px}

/* Прогресс-бар */
.progress-bar{
  height:8px;background:#080b10;border-radius:99px;overflow:hidden;
  margin:10px 0 6px;
}
.progress-bar>div{
  height:100%;background:linear-gradient(90deg,#b98b27,#ffe38a);
  width:35%;
}

/* Заголовок карточки */
.section-title{
  color:var(--gold);font-size:13px;font-weight:bold;
  letter-spacing:.6px;margin-bottom:12px;
}

.card{
  background:linear-gradient(145deg,#1b2636,#111925);
  border:1px solid #39475b;border-radius:18px;padding:14px;
  margin-bottom:12px;
}

/* Двухколоночная сетка действий */
.actions-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.action-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px 8px;border-radius:14px;border:1px solid #45536a;
  background:linear-gradient(145deg,#1e2938,#141b26);
  color:#fff;font-size:12px;font-weight:bold;
  cursor:pointer;margin:0;min-height:84px;
  transition:transform .1s;
}
.action-btn:active{transform:scale(.97)}
.action-btn .icon{font-size:22px;margin-bottom:6px}
.action-btn.gold{
  background:linear-gradient(135deg,#f5d477,#c99629);
  color:#17120a;border-color:#a37a1e;
}

/* Балансы */
.token-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.token-box{
  background:#0d1520;border:1px solid #303d50;border-radius:14px;
  padding:12px;
}
.token-name{color:var(--muted);font-size:11px}
.token-value{color:#fff;font-size:18px;font-weight:bold;margin-top:4px}

/* Титул */
.rank-box{
  border:1px solid #66572e;
  background:linear-gradient(145deg,#272313,#17150e);
  border-radius:14px;padding:12px;
}
.rank-name{font-size:20px;font-weight:bold;color:var(--gold)}

.info{color:var(--muted);font-size:11px;line-height:1.4}
.muted{color:var(--muted)}

/* Нижняя навигация (фиксированная) */
.nav{
  position:fixed;z-index:900;bottom:0;left:0;right:0;
  background:#0e151fef;backdrop-filter:blur(12px);
  border-top:1px solid #303d4f;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:5px;
}
.nav button{
  flex:1;max-width:120px;padding:10px 4px;margin:0;
  background:#1b2635;color:#d9e0e8;font-size:10px;
  border:1px solid transparent;border-radius:10px;
  cursor:pointer;
}
.nav button.active{background:#80652d;color:#fff}

.badge{
  display:inline-block;background:#3d2a10;color:#f5cf6a;
  font-size:9px;padding:2px 6px;border-radius:6px;margin-left:6px;
  vertical-align:middle;font-weight:normal;
}
</style>
</head>
<body>
<div class="app">

  <h1>👑 ТЕЛЕПАТ</h1>
  <div class="subtitle">Виртуальный P2P-обменник</div>

  <!-- Верхняя панель иконок -->
  <div class="topbar">
    <button title="Профиль">👤</button>
    <button title="Уведомления">🔔</button>
    <button title="Кошелёк">💼</button>
    <button title="FAQ">❓</button>
    <button title="Настройки">⚙️</button>
  </div>

  <!-- Статистика -->
  <div class="stats">
    <div class="stat"><b>7.88</b><span>TG</span></div>
    <div class="stat"><b>3 299</b><span>TUSD</span></div>
    <div class="stat"><b>12</b><span>Титул</span></div>
  </div>

  <!-- Профиль с прогрессом -->
  <div class="card">
    <div class="section-title">👤 МОЙ ПРОФИЛЬ</div>
    <div class="rank-box">
      <div class="info">ТЕКУЩИЙ ТИТУЛ</div>
      <div class="rank-name">👑 Серебряный рыцарь</div>
      <div class="progress-bar"><div></div></div>
      <div class="info">До следующего: <b style="color:#f4cf70">35%</b> • Осталось 25.6 USD</div>
    </div>
  </div>

  <!-- Балансы -->
  <div class="card">
    <div class="section-title">💰 МОЙ КОШЕЛЁК</div>
    <div class="token-row">
      <div class="token-box">
        <div class="token-name">Telepat Gold</div>
        <div class="token-value" style="color:#f4cf70">7.88 TG</div>
      </div>
      <div class="token-box">
        <div class="token-name">AI</div>
        <div class="token-value">0 AI</div>
      </div>
    </div>
    <div class="token-box" style="margin-top:8px">
      <div class="token-name">Telepat Dollar</div>
      <div class="token-value">3 299.95 TUSD</div>
    </div>
  </div>

  <!-- Сетка действий 2 колонки -->
  <div class="card">
    <div class="section-title">⚡ БЫСТРЫЕ ДЕЙСТВИЯ</div>
    <div class="actions-grid">
      <button class="action-btn">
        <span class="icon">🔄</span>
        <span>ОБМЕН</span>
      </button>
      <button class="action-btn">
        <span class="icon">📋</span>
        <span>МОИ ОРДЕРА</span>
      </button>
      <button class="action-btn">
        <span class="icon">💧</span>
        <span>ПУЛЫ</span>
      </button>
      <button class="action-btn">
        <span class="icon">🤝</span>
        <span>СДЕЛКИ</span>
      </button>
      <button class="action-btn gold">
        <span class="icon">🎁</span>
        <span>БОНУС<span class="badge">1</span></span>
      </button>
      <button class="action-btn gold">
        <span class="icon">💎</span>
        <span>ЕЖЕДНЕВКА</span>
      </button>
    </div>
  </div>

  <!-- Друзья и заработок -->
  <div class="card">
    <div class="section-title">👥 ДРУЗЬЯ И ЗАРАБОТОК</div>
    <div class="token-row">
      <div class="token-box">
        <div class="token-name">Заработано TG</div>
        <div class="token-value">0</div>
      </div>
      <div class="token-box">
        <div class="token-name">Заработано TUSD</div>
        <div class="token-value">0</div>
      </div>
    </div>
    <button class="action-btn" style="margin-top:10px;min-height:auto;padding:12px">
      📋 СКОПИРОВАТЬ РЕФ-ССЫЛКУ
    </button>
  </div>

</div>

<!-- Нижняя навигация -->
<div class="nav">
  <button class="active">🏠 Кошелёк</button>
  <button>🔄 Обмен</button>
  <button>👥 Друзья</button>
  <button>💎 Заработок</button>
  <button>👑 Админ</button>
</div>

</body>
</html>
