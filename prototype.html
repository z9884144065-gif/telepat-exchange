<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Телепат — Прототип</title>
<style>
:root{--bg:#0b1018;--card:#141c28;--line:#39475b;--gold:#f4cf70;--text:#fff;--muted:#9da9b9;--green:#39d98a;--red:#ff647c;--blue:#4f8cff}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#26334a 0,#0b1018 42%),#0b1018;color:var(--text);font-family:-apple-system,Arial,sans-serif;min-height:100vh}
.app{max-width:560px;margin:auto;padding:14px 14px 100px}
h1{text-align:center;color:var(--gold);margin:5px 0 3px;font-size:26px}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px}
.card{background:linear-gradient(145deg,#1b2636,#111925);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:13px;box-shadow:0 12px 30px #0007}
.card.gold{border-color:#80652b}
.title{color:var(--gold);font-size:13px;font-weight:bold;letter-spacing:.7px;margin-bottom:13px}
button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:13px;background:linear-gradient(135deg,#f5d477,#c99629);color:#17120a;font-weight:bold;cursor:pointer;font-size:15px}
button.sec{background:#263345;color:#fff;border:1px solid #4a596d}
button.sm{width:auto;padding:8px 11px;margin:0;font-size:12px}
.info{color:var(--muted);font-size:12px;line-height:1.45}
.dt{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #263141;font-size:12px}
.dt:last-child{border-bottom:0}
.dt span:first-child{color:#8996a7}
.dt span:last-child{text-align:right}

/* Список токенов — как в iCryptoCheck */
.token-row{display:flex;align-items:center;gap:12px;padding:13px;background:linear-gradient(145deg,#101a28,#0c121c);border:1px solid #2d3a4c;border-radius:15px;margin-bottom:8px;cursor:pointer;transition:transform .15s}
.token-row:active{transform:scale(.98)}
.token-row:hover{border-color:#4a596d}
.tlogo{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#0d1520;box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.07)}
.tlogo.tg{background:linear-gradient(135deg,#f5d477,#c99629)}
.tlogo.tusd{background:linear-gradient(135deg,#39d98a,#2ba86a)}
.tlogo.ai{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.tlogo.vk{background:linear-gradient(135deg,#4f8cff,#2563eb)}
.tlogo.rub{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.token-info{flex:1;min-width:0}
.token-sym{color:#fff;font-weight:bold;font-size:15px}
.token-bal{color:#8f9bab;font-size:11px;margin-top:2px}
.token-counter{font-size:12px;margin-top:4px;font-weight:600}
.counter-active{color:#39d98a}
.counter-idle{color:#8f9bab}
.token-value{text-align:right}
.token-value b{color:#fff;font-size:15px;display:block}
.token-value span{color:#8f9bab;font-size:11px}

/* Модалка */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:1000;padding:12px}
.modal.show{display:flex}
.modal-inner{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:linear-gradient(145deg,#1d2939,#101721);border:1px solid #68562a;border-radius:22px;padding:20px}
.modal-title{color:var(--gold);font-size:18px;font-weight:bold;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.close-btn{background:none;border:0;color:#9da9b9;font-size:22px;cursor:pointer;width:auto;padding:0 8px;margin:0}
.pool-status{font-size:13px;font-weight:bold;padding:8px 12px;border-radius:10px;margin:10px 0}
.pool-active{background:rgba(57,217,138,.12);color:#39d98a;border:1px solid rgba(57,217,138,.3)}
.pool-idle{background:rgba(143,155,171,.12);color:#8f9bab;border:1px solid rgba(143,155,171,.3)}
.toast{position:fixed;left:12px;right:12px;bottom:80px;padding:12px;border-radius:12px;background:#1b2737;border:1px solid #4c5b70;text-align:center;font-size:13px;display:none;z-index:2000}
.toast.show{display:block;animation:slideUp .3s}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.glow{animation:glow 1.5s}
@keyframes glow{0%{box-shadow:0 0 0 rgba(57,217,138,0)}50%{box-shadow:0 0 20px rgba(57,217,138,.6)}100%{box-shadow:0 0 0 rgba(57,217,138,0)}}
</style>
</head>
<body>
<div class="app">

<h1>👑 ТЕЛЕПАТ</h1>
<div class="sub">Виртуальный P2P-обменник</div>

<div class="card">
  <div class="title">💰 МОИ ТОКЕНЫ</div>
  <div id="tokenList"></div>
  <button class="sec" onclick="openPoolsOverview()" style="margin-top:14px">💧 Все пулы</button>
</div>

<div class="card gold">
  <div class="title">⚡ СИМУЛЯЦИЯ</div>
  <div class="info" style="margin-bottom:10px">Нажми, чтобы увидеть как работает счётчик в реальном времени</div>
  <button onclick="simulateTrade()">💸 Симулировать сделку (P2P)</button>
  <button class="sec" onclick="simulateAdRevenue()">📢 Симулировать доход от рекламы</button>
  <button class="sec" onclick="togglePool('AI')">⚪ Вкл/выкл пул AI</button>
</div>

</div>

<!-- Модалка деталей токена -->
<div id="detailsModal" class="modal" onclick="if(event.target===this)closeModal('detailsModal')">
  <div class="modal-inner" id="detailsBody"></div>
</div>

<!-- Модалка всех пулов -->
<div id="poolsModal" class="modal" onclick="if(event.target===this)closeModal('poolsModal')">
  <div class="modal-inner">
    <div class="modal-title">💧 ВСЕ ПУЛЫ <button class="close-btn" onclick="closeModal('poolsModal')">✕</button></div>
    <div id="poolsBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ==================== ФЕЙКОВЫЕ ДАННЫЕ ====================
const PRICES = {
  TG: 100, TUSD: 1, AI: 0.01, VKCOIN: 0.5, RUB: 0.011
};

let POOLS = {
  TG: {
    symbol: 'TG',
    reserve_token: 5200,
    reserve_tusd: 520000,
    fees_today: 240,
    fees_week: 1680,
    fees_all: 45000,
    is_active: true,
    my_stake: 0.5,
    days_left: 40
  },
  TUSD: {
    symbol: 'TUSD',
    reserve_token: 50000,
    reserve_tusd: 50000,
    fees_today: 12,
    fees_week: 84,
    fees_all: 2400,
    is_active: true,
    my_stake: 100,
    days_left: 45
  },
  AI: {
    symbol: 'AI',
    reserve_token: 2000000,
    reserve_tusd: 20000,
    fees_today: 0,
    fees_week: 0,
    fees_all: 500,
    is_active: false,
    my_stake: 50,
    days_left: null
  },
  VKCOIN: {
    symbol: 'VKCOIN',
    reserve_token: 1000,
    reserve_tusd: 500,
    fees_today: 3.2,
    fees_week: 22.4,
    fees_all: 320,
    is_active: true,
    my_stake: 20,
    days_left: 22
  },
  RUB: {
    symbol: 'RUB',
    reserve_token: 100000,
    reserve_tusd: 1100,
    fees_today: 0,
    fees_week: 2,
    fees_all: 50,
    is_active: false,
    my_stake: 0,
    days_left: null
  }
};

let BALANCES = {
  TG: 1.8462,
  TUSD: 975.27,
  AI: 416.17,
  VKCOIN: 500,
  RUB: 5000
};

const ICONS = {
  TG:     { emoji: '🥇', cls: 'tg' },
  TUSD:   { emoji: '💵', cls: 'tusd' },
  AI:     { emoji: '🤖', cls: 'ai' },
  VKCOIN: { emoji: '🎮', cls: 'vk' },
  RUB:    { emoji: '₽',  cls: 'rub' }
};

// ==================== ЛОГИКА РАСЧЁТА ====================
function calcMyDaily(symbol) {
  const p = POOLS[symbol];
  if (!p || !p.is_active || !p.my_stake || p.reserve_token <= 0) return 0;
  const share = p.my_stake / p.reserve_token;
  return share * p.fees_today * 0.60; // 60% в стейкинг
}

function calcValue(symbol, amount) {
  return amount * (PRICES[symbol] || 0);
}

function fmt(n, d=2) {
  return Number(n).toLocaleString('ru-RU', {maximumFractionDigits: d});
}

// ==================== РЕНДЕР СПИСКА ТОКЕНОВ ====================
function renderTokens() {
  const list = document.getElementById('tokenList');
  list.innerHTML = Object.keys(BALANCES).map(sym => {
    const bal = BALANCES[sym];
    const value = calcValue(sym, bal);
    const icon = ICONS[sym] || { emoji: '🪙', cls: '' };
    const daily = calcMyDaily(sym);
    const p = POOLS[sym];
    
    let counterHtml = '';
    if (!p) {
      counterHtml = `<div class="token-counter counter-idle">⚪ Нет пула</div>`;
    } else if (p.is_active && daily > 0) {
      counterHtml = `<div class="token-counter counter-active">💧 Пул активен | +$${fmt(daily, 4)}/день</div>`;
    } else if (p.is_active && p.my_stake === 0) {
      counterHtml = `<div class="token-counter counter-idle">💧 Пул активен | нет стейка</div>`;
    } else if (p.is_active) {
      counterHtml = `<div class="token-counter counter-active">💧 Пул активен</div>`;
    } else {
      counterHtml = `<div class="token-counter counter-idle">⚪ Пул неактивен</div>`;
    }
    
    return `
      <div class="token-row" onclick="openDetails('${sym}')" id="row-${sym}">
        <div class="tlogo ${icon.cls}">${icon.emoji}</div>
        <div class="token-info">
          <div class="token-sym">${sym}</div>
          <div class="token-bal">${fmt(bal, 6)} ${sym} ≈ $${fmt(value)}</div>
          ${counterHtml}
        </div>
        <div class="token-value">
          <b>$${fmt(value)}</b>
          <span>${fmt(bal, 4)}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ==================== МОДАЛКА ДЕТАЛЕЙ ТОКЕНА ====================
function openDetails(sym) {
  const p = POOLS[sym];
  const bal = BALANCES[sym];
  const icon = ICONS[sym] || { emoji: '🪙', cls: '' };
  const daily = calcMyDaily(sym);
  
  let html = `
    <div class="modal-title">
      ${icon.emoji} ${sym}
      <button class="close-btn" onclick="closeModal('detailsModal')">✕</button>
    </div>
    <div class="dt"><span>Мой баланс</span><span><b>${fmt(bal, 6)} ${sym}</b></span></div>
    <div class="dt"><span>Стоимость</span><span><b>$${fmt(calcValue(sym, bal))}</b></span></div>
    <div class="dt"><span>Цена</span><span>1 ${sym} = $${fmt(PRICES[sym], 6)}</span></div>
  `;
  
  if (!p) {
    html += `<div class="pool-status pool-idle">⚪ Пул для этого токена не запущен</div>`;
  } else {
    const statusCls = p.is_active ? 'pool-active' : 'pool-idle';
    const statusTxt = p.is_active ? '🟢 ПУЛ АКТИВЕН' : '⚪ ПУЛ НЕАКТИВЕН';
    
    html += `<div class="pool-status ${statusCls}">${statusTxt}</div>`;
    
    html += `<div style="margin-top:14px">
      <div class="dt"><span>В пуле</span><span>${fmt(p.reserve_token, 4)} ${sym}</span></div>
      <div class="dt"><span>Резерв TUSD</span><span>$${fmt(p.reserve_tusd)}</span></div>
      <div class="dt"><span>Мой стейк</span><span>${fmt(p.my_stake, 4)} ${sym}</span></div>
      <div class="dt"><span>Моя доля</span><span>${p.reserve_token > 0 ? fmt(p.my_stake/p.reserve_token*100, 2) : 0}%</span></div>
      <div class="dt"><span>Доход за сегодня</span><span style="color:var(--green)">+$${fmt(p.fees_today, 4)}</span></div>
      <div class="dt"><span>Доход за 7 дней</span><span style="color:var(--green)">+$${fmt(p.fees_week, 4)}</span></div>
      <div class="dt"><span>Всего собрано</span><span>$${fmt(p.fees_all)}</span></div>
    </div>`;
    
    if (daily > 0) {
      html += `<div class="pool-status pool-active" style="margin-top:14px">
        💰 Мой доход: <b>+$${fmt(daily, 4)}/день</b>
      </div>`;
    }
    
    if (p.days_left) {
      html += `<div class="info" style="margin-top:10px;text-align:center">
        ⏳ При текущем темпе пула хватит на <b>${Math.floor(p.days_left)} дней</b>
      </div>`;
    }
  }
  
  document.getElementById('detailsBody').innerHTML = html;
  document.getElementById('detailsModal').classList.add('show');
}

// ==================== МОДАЛКА ВСЕХ ПУЛОВ ====================
function openPoolsOverview() {
  const body = document.getElementById('poolsBody');
  body.innerHTML = Object.keys(POOLS).map(sym => {
    const p = POOLS[sym];
    const icon = ICONS[sym] || { emoji: '🪙', cls: '' };
    const statusCls = p.is_active ? 'pool-active' : 'pool-idle';
    const statusTxt = p.is_active ? '🟢 АКТИВЕН' : '⚪ НЕАКТИВЕН';
    const daily = calcMyDaily(sym);
    
    let extra = '';
    if (daily > 0) {
      extra += `<div class="dt"><span>Мой доход/день</span><span style="color:var(--gold);font-weight:bold">+$${fmt(daily, 4)}</span></div>`;
    }
    if (p.days_left) {
      extra += `<div class="dt"><span>Хватит на</span><span>~${Math.floor(p.days_left)} дней</span></div>`;
    }
    
    return `
      <div class="card" style="margin-bottom:10px">
        <div class="title">${icon.emoji} ${sym}</div>
        <div class="pool-status ${statusCls}">${statusTxt}</div>
        <div class="dt"><span>В пуле</span><span>${fmt(p.reserve_token, 4)} ${sym}</span></div>
        <div class="dt"><span>Резерв TUSD</span><span>$${fmt(p.reserve_tusd)}</span></div>
        <div class="dt"><span>Доход сегодня</span><span style="color:var(--green)">+$${fmt(p.fees_today, 4)}</span></div>
        <div class="dt"><span>Доход за 7 дней</span><span style="color:var(--green)">+$${fmt(p.fees_week, 4)}</span></div>
        ${extra}
      </div>
    `;
  }).join('');
  document.getElementById('poolsModal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// ==================== СИМУЛЯЦИИ ====================
function simulateTrade() {
  // Имитируем P2P-сделку на TG
  POOLS.TG.fees_today += 1.5;
  POOLS.TG.fees_week += 1.5;
  POOLS.TG.fees_all += 1.5;
  renderTokens();
  showToast('💸 +$1.50 TUSD в пул TG (P2P-комиссия)');
  flashRow('TG');
}

function simulateAdRevenue() {
  // Имитируем доход от рекламы
  POOLS.TG.fees_today += 5;
  POOLS.TG.fees_week += 5;
  POOLS.TG.fees_all += 5;
  renderTokens();
  showToast('📢 +$5.00 TUSD в пул TG (реклама)');
  flashRow('TG');
}

function togglePool(sym) {
  if (!POOLS[sym]) return;
  POOLS[sym].is_active = !POOLS[sym].is_active;
  renderTokens();
  showToast(POOLS[sym].is_active ? `✅ Пул ${sym} включён` : `⚪ Пул ${sym} выключен`);
  flashRow(sym);
}

// ==================== ВСПОМОГАТЕЛЬНОЕ ====================
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function flashRow(sym) {
  const row = document.getElementById('row-' + sym);
  if (!row) return;
  row.classList.add('glow');
  setTimeout(() => row.classList.remove('glow'), 1500);
}

// ==================== СТАРТ ====================
renderTokens();
</script>
</body>
</html>
